<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MP4 to MP3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="ffmpeg.min.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d0d0d;
      --surface: #161618;
      --surface-hover: #1c1c1f;
      --accent: #ea580c;
      --accent-glow: #f97316;
      --text: #fafafa;
      --text-dim: #71717a;
      --border: #27272a;
      --success: #22c55e;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(234, 88, 12, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(234, 88, 12, 0.06) 0%, transparent 40%);
    }

    .app {
      width: 100%;
      max-width: 520px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(234, 88, 12, 0.3), transparent);
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    .tagline {
      color: var(--text-dim);
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .dropzone {
      border: 1.5px dashed var(--border);
      border-radius: 14px;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      background: transparent;
    }

    .dropzone:hover {
      border-color: var(--accent);
      background: rgba(234, 88, 12, 0.04);
    }

    .dropzone.dragover {
      border-color: var(--accent);
      background: rgba(234, 88, 12, 0.08);
      transform: scale(1.01);
    }

    .dropzone-icon {
      width: 44px;
      height: 44px;
      margin: 0 auto 16px;
      color: var(--accent);
    }

    .dropzone-text {
      font-size: 0.95rem;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .dropzone-formats {
      font-size: 0.75rem;
      color: var(--text-dim);
      opacity: 0.7;
    }

    .file-input {
      display: none;
    }

    .file-section {
      display: none;
      margin-top: 28px;
    }

    .file-section.active {
      display: block;
    }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .file-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .file-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, rgba(234, 88, 12, 0.2), rgba(234, 88, 12, 0.08));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
    }

    .file-details {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-size {
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .file-status {
      font-size: 0.7rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 500;
      white-space: nowrap;
    }

    .file-status.pending {
      background: var(--surface-hover);
      color: var(--text-dim);
    }

    .file-status.converting {
      background: rgba(234, 88, 12, 0.15);
      color: var(--accent-glow);
    }

    .file-status.done {
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
    }

    .file-status.error {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }

    .remove-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .remove-btn:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    .progress-track {
      height: 3px;
      background: var(--bg);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
      display: none;
    }

    .progress-track.active {
      display: block;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-glow));
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-glow);
      box-shadow: 0 4px 20px rgba(234, 88, 12, 0.35);
    }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--surface-hover);
      color: var(--text);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #242428;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-text {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 16px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <h1>MP4 to MP3</h1>
      <p class="tagline">Extrae el audio de tus videos</p>

      <div class="dropzone" id="dropzone">
        <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
        </svg>
        <p class="dropzone-text">Arrastra archivos MP4 aquí</p>
        <p class="dropzone-formats">o haz clic para seleccionar</p>
      </div>
      <input type="file" class="file-input" id="fileInput" accept="video/mp4" multiple>

      <div class="file-section" id="fileSection">
        <div class="file-list" id="fileList"></div>
        <div class="actions">
          <button class="btn btn-primary" id="convertBtn">
            <span id="btnText">Convertir</span>
          </button>
          <button class="btn btn-secondary" id="downloadBtn" style="display:none;">Descargar</button>
        </div>
      </div>

      <div class="status-text" id="statusText">Procesamiento 100% local en tu navegador</div>
    </div>
  </div>

  <script>
    const { FFmpeg } = FFmpegWASM;
    const fetchFile = async (file) => new Uint8Array(await file.arrayBuffer());

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const fileSection = document.getElementById('fileSection');
    const fileList = document.getElementById('fileList');
    const convertBtn = document.getElementById('convertBtn');
    const btnText = document.getElementById('btnText');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusText = document.getElementById('statusText');

    let ffmpeg = null;
    let files = [];
    let convertedFiles = [];

    async function initFFmpeg() {
      if (ffmpeg) return ffmpeg;
      ffmpeg = new FFmpeg();
      
      ffmpeg.on('log', ({ message }) => console.log('[FFmpeg]', message));
      ffmpeg.on('progress', ({ progress }) => console.log('[FFmpeg] Progress:', Math.round(progress * 100) + '%'));
      
      console.log('Cargando FFmpeg...');
      
      try {
        await ffmpeg.load({
          coreURL: './ffmpeg-core.js',
          wasmURL: './ffmpeg-core.wasm'
        });
        console.log('FFmpeg cargado');
      } catch(e) {
        console.error('Error cargando FFmpeg:', e);
        throw e;
      }
      
      return ffmpeg;
    }

    function formatBytes(b) {
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
      return (b / 1048576).toFixed(1) + ' MB';
    }

    function addFiles(fileList) {
      const valid = Array.from(fileList).filter(f => 
        f.type === 'video/mp4' || f.name.toLowerCase().endsWith('.mp4')
      );
      if (valid.length === 0) {
        alert('Selecciona archivos MP4');
        return;
      }
      files = [...files, ...valid];
      convertedFiles = [];
      renderFiles();
      fileSection.classList.add('active');
      dropzone.style.display = 'none';
      resetConvertButton();
    }

    function renderFiles() {
      fileList.innerHTML = files.map((f, i) => `
        <div class="file-item">
          <div class="file-icon">▶</div>
          <div class="file-details">
            <div class="file-name">${f.name}</div>
            <div class="file-size">${formatBytes(f.size)}</div>
            <div class="progress-track" id="progress-${i}">
              <div class="progress-fill" id="fill-${i}"></div>
            </div>
          </div>
          <span class="file-status pending" id="status-${i}">Pendiente</span>
          <button class="remove-btn" onclick="removeFile(${i})">✕</button>
        </div>
      `).join('');
    }

    window.removeFile = function(i) {
      files.splice(i, 1);
      convertedFiles.splice(i, 1);
      if (files.length === 0) {
        fileSection.classList.remove('active');
        dropzone.style.display = 'block';
        convertedFiles = [];
        resetConvertButton();
      } else {
        renderFiles();
      }
    };

    function resetConvertButton() {
      convertBtn.disabled = false;
      btnText.textContent = 'Convertir';
      statusText.textContent = 'Listo para convertir';
      downloadBtn.style.display = 'none';
    }

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', e => { e.preventDefault(); dropzone.classList.remove('dragover'); addFiles(e.dataTransfer.files); });
    fileInput.addEventListener('change', e => { addFiles(e.target.files); fileInput.value = ''; });

    convertBtn.addEventListener('click', async () => {
      if (files.length === 0) return;
      if (convertBtn.disabled) return;
      
      convertBtn.disabled = true;
      btnText.innerHTML = '<div class="spinner"></div> Cargando FFmpeg...';
      statusText.textContent = 'Inicializando...';
      
      try {
        const ff = await initFFmpeg();
        convertedFiles = [];
        
        for (let i = 0; i < files.length; i++) {
          const statusEl = document.getElementById(`status-${i}`);
          const progressEl = document.getElementById(`progress-${i}`);
          const fillEl = document.getElementById(`fill-${i}`);
          
          statusEl.className = 'file-status converting';
          statusEl.textContent = 'Convirtiendo';
          progressEl.classList.add('active');
          fillEl.style.width = '0%';
          
          const inputName = `input_${i}.mp4`;
          const outputName = `output_${i}.mp3`;
          
          try {
            await ff.writeFile(inputName, await fetchFile(files[i]));
            
            const progressHandler = ({ progress }) => {
              if (fillEl) fillEl.style.width = (progress * 100) + '%';
            };
            ff.on('progress', progressHandler);
            
            await ff.exec(['-i', inputName, '-vn', '-acodec', 'libmp3lame', '-q:a', '2', outputName]);
            
            ff.off('progress', progressHandler);
            
            const data = await ff.readFile(outputName);
            const blob = new Blob([data], { type: 'audio/mpeg' });
            convertedFiles.push(blob);
            
            await ff.deleteFile(inputName);
            await ff.deleteFile(outputName);
            
            statusEl.className = 'file-status done';
            statusEl.textContent = 'Listo';
            progressEl.classList.remove('active');
            fillEl.style.width = '100%';
          } catch (fileErr) {
            console.error('Error converting file:', fileErr);
            statusEl.className = 'file-status error';
            statusEl.textContent = 'Error';
            progressEl.classList.remove('active');
          }
        }
        
        const successCount = convertedFiles.length;
        if (successCount > 0) {
          statusText.textContent = `¡${successCount} archivo(s) convertido(s)!`;
          downloadBtn.style.display = 'flex';
          downloadBtn.textContent = successCount === 1 ? 'Descargar MP3' : 'Descargar Todo';
          btnText.textContent = 'Convertido';
        } else {
          statusText.textContent = 'Error: No se pudo convertir ningún archivo';
          btnText.textContent = 'Convertir';
          convertBtn.disabled = false;
        }
        
      } catch (err) {
        console.error('FFmpeg error:', err);
        statusText.textContent = 'Error: ' + err.message;
        files.forEach((_, i) => {
          const statusEl = document.getElementById(`status-${i}`);
          if (statusEl) {
            statusEl.className = 'file-status error';
            statusEl.textContent = 'Error';
          }
        });
        btnText.textContent = 'Convertir';
        convertBtn.disabled = false;
      }
    });

    downloadBtn.addEventListener('click', () => {
      if (convertedFiles.length === 0) return;
      
      if (convertedFiles.length === 1) {
        const url = URL.createObjectURL(convertedFiles[0]);
        const a = document.createElement('a');
        a.href = url;
        a.download = files[0].name.replace(/\.mp4$/i, '.mp3');
        a.click();
        URL.revokeObjectURL(url);
      } else {
        const zip = new JSZip();
        convertedFiles.forEach((blob, i) => {
          zip.file(files[i].name.replace(/\.mp4$/i, '.mp3'), blob);
        });
        zip.generateAsync({ type: 'blob' }).then(content => {
          const url = URL.createObjectURL(content);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'audios.zip';
          a.click();
          URL.revokeObjectURL(url);
        });
      }
    });
  </script>
</body>
</html>
